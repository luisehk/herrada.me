# herrada.me, served from the k3s node behind Cloudflare's proxy (RK-0029).
# thepocketschool.mx's shape. The zone is on Full (ADR 0062), and the origin
# never redirects anyway: Cloudflare sends plain HTTP visitors to port 80, a
# redirect there would loop if the zone were ever on Flexible, and RK-0029
# criterion 3 keeps plain HTTP on the apex unredirected, as GitHub Pages does
# today. www goes to the apex in Traefik's redirect-www Middleware.

# Cache policy by extension, then by status. Declared with `map` at http level
# (conf.d files are included inside http {}) so a single server-level add_header
# covers every location: nginx's add_header inheritance means any location-level
# add_header would silently drop the security headers below.
#
# No asset name carries a version, so assets get GitHub Pages' ten minutes
# (max-age=600) and the page is no-cache: after a `make cd` that changes
# style.css, the new page meets the old stylesheet for ten minutes at most, not
# a day. Only a 200 or a 304 gets the asset policy. Any other status is
# no-cache, so a 404 on an asset-like path (a new image asked of an old pod
# mid-rollout) is never cached publicly.
map $uri $asset_cache {
    default                                               "no-cache";
    ~*\.(css|js|woff2|jpe?g|png|webp|svg|ico|webmanifest)$ "public, max-age=600";
}

map $status $cache_control {
    200     $asset_cache;
    304     $asset_cache;
    default "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Traefik fronts this pod; trust its forwarded client address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # A directory redirect (/images -> /images/) must stay relative: TLS
    # terminates at Traefik, so an absolute redirect would point at http://.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_vary on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    # Backs the k8s probes, the Docker HEALTHCHECK and `make cd`'s check of
    # https://herrada.me/health.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # A missing path is a 404, never the home page, and it shows the guide's
    # missing sheet. A directory with no index (/fonts/, /assets/, and /images/
    # from the old site) answers 404 as GitHub Pages did, not 403 (HM-0002
    # criterion 4), and so does a denied dot path. 404.html links its files
    # root-relative, so it renders at any depth.
    error_page 403 =404 /404.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
