# GitHub Pages builds this repo with Jekyll until RK-0029's step D4 turns Pages
# off (2026-12-02). Pages publishes the site alone: the three pages, style.css,
# script.js, fonts/, assets/ and CNAME. The build, the image, the manifest and
# the make files stay out of it. Jekyll skips dotfiles and this file by itself.
# scripts/check-repo.sh (in `make ci`) fails when a tracked file would publish
# and is not one of the site's.
exclude:
  - Makefile
  - app.mk
  - build
  - docker
  - k8s
  - scripts
